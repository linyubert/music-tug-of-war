<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

     若你的 GitHub 帳號或 repo 名稱不同，改下面 SITE 這一段網址即可 -->

<meta property="og:description" content="兩隊同時搶答的五線譜認讀遊戲，適合音樂課用大觸控螢幕分組競賽。">

<meta name="twitter:title"       content="五線譜拔河賽">
<meta name="twitter:description" content="兩隊同時搶答的五線譜認讀遊戲，適合音樂課用大觸控螢幕分組競賽。">
<meta name="twitter:image"       content="https://linyubert.github.io/music-tug-of-war/cover.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Music&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#1565c0; --blue-dark:#0b3d75; --blue-soft:#e3f0fc; --blue-line:#8fbdec;
  --red:#c62828;  --red-dark:#7d1414;  --red-soft:#fdeaea;  --red-line:#eb9a9a;
  --ink:#20232a; --muted:#6b7280; --bg:#f4f5f7; --card:#ffffff; --line:#d8dbe0;
  --good:#2e7d32; --good-soft:#e6f4e6;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;}
body{
  font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
  background:var(--bg); color:var(--ink); overflow:hidden;
  touch-action:none; -webkit-user-select:none; user-select:none;
}
button{font-family:inherit;}

/* ---------- 通用 ---------- */
.hidden{display:none !important;}
.screen{position:fixed; inset:0; display:flex; flex-direction:column;}

/* ---------- 首頁 ---------- */
#title{background:#07091a; align-items:center; justify-content:center; overflow:hidden;}
/* 舞台鎖定封面比例（2400×1348），所有按鈕用百分比對齊圖上的圖形 */
#stage{position:relative; --sw:min(100vw, 177.9vh); width:var(--sw); height:calc(var(--sw) / 1.7804);}
#coverimg{width:100%; height:100%; display:block; user-select:none; -webkit-user-drag:none;}

.hot{position:absolute; border:0; background:transparent; cursor:pointer; padding:0;
     border-radius:calc(var(--sw) * .007); animation:hotpulse 2.2s ease-in-out infinite;}
#startGame{left:2.0%;  top:89.2%; width:18.0%; height:7.8%;}
#toSetup  {left:79.6%; top:89.2%; width:19.2%; height:7.8%;}
.hot:hover{background:rgba(255,255,255,.14);}
.hot:active{transform:scale(.97);}
@keyframes hotpulse{0%,100%{box-shadow:inset 0 0 0 0 rgba(255,255,255,0), 0 0 0 0 rgba(255,255,255,0);}
                    50%{box-shadow:inset 0 0 calc(var(--sw)*.008) rgba(255,255,255,.35),
                                   0 0 calc(var(--sw)*.012) rgba(255,255,255,.42);}}

.social{position:absolute; left:82.2%; top:13.4%; width:15.8%;
        display:flex; flex-direction:column; gap:calc(var(--sw) * .008);}
.social a{display:flex; align-items:center; justify-content:center; gap:.55em; text-decoration:none;
  height:calc(var(--sw) * .032); font-size:calc(var(--sw) * .0132); font-weight:800; letter-spacing:.04em;
  color:#fff; background:rgba(8,10,22,.72); border:2px solid rgba(255,255,255,.8);
  clip-path:polygon(7% 0,100% 0,93% 100%,0 100%);}
.social a.th{border-color:#8fd0ff;} .social a.yt{border-color:#ff6b6b;}
.social a:hover{background:rgba(255,255,255,.18);}
.social a:active{transform:translateY(2px);}
.social svg{width:1.35em; height:1.35em; flex:none;}
.cornerbtn{position:absolute; left:2.2%; top:16.5%; cursor:pointer; color:#fff;
  background:rgba(8,10,22,.72); border:2px solid rgba(255,255,255,.8);
  clip-path:polygon(7% 0,100% 0,93% 100%,0 100%);
  padding:calc(var(--sw) * .008) calc(var(--sw) * .016);
  font-size:calc(var(--sw) * .0132); font-weight:800; letter-spacing:.04em;}
.cornerbtn:hover{background:rgba(255,255,255,.18);}
.cornerbtn:active{transform:translateY(2px);}

/* ---------- 設定頁：Neo-Brutalism ---------- */
:root{ --nb-ink:#111111; --nb-sh:8px 8px 0 var(--nb-ink); --nb-sh-sm:5px 5px 0 var(--nb-ink); }
#setup{
  overflow:auto; touch-action:pan-y; padding:4vh 4vw 6vh; align-items:center;
  background:#ffd23f;
  background-image:linear-gradient(rgba(17,17,17,.09) 2px, transparent 2px),
                   linear-gradient(90deg, rgba(17,17,17,.09) 2px, transparent 2px);
  background-size:34px 34px;
  color:var(--nb-ink);
}
#setupHome{align-self:flex-start; margin-bottom:2.4vh;}
#setup h1{
  display:inline-block; margin:0 0 14px; padding:.18em .6em .24em;
  background:var(--nb-ink); color:#ffd23f; transform:rotate(-1.4deg);
  font-size:clamp(30px,5vw,62px); font-weight:900; letter-spacing:.03em;
  border:4px solid var(--nb-ink); box-shadow:10px 10px 0 #ff5a5a;
}
#setup .sub{
  margin:0 0 3.4vh; padding:.35em .8em; background:#fff; border:3px solid var(--nb-ink);
  box-shadow:var(--nb-sh-sm); font-size:clamp(14px,1.5vw,19px); font-weight:800;
}
.panel{
  width:min(1040px,100%); background:#fff; border:4px solid var(--nb-ink); border-radius:0;
  box-shadow:var(--nb-sh); padding:clamp(18px,2.6vw,34px); margin-bottom:3vh;
}
.row{display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin-bottom:22px;}
.row:last-child{margin-bottom:0;}
.row > .lbl{
  width:158px; flex:none; font-weight:900; font-size:clamp(14px,1.4vw,18px);
  background:#111; color:#fff; padding:.34em .6em; letter-spacing:.06em;
  border:3px solid var(--nb-ink); box-shadow:4px 4px 0 #4dd0e1;
}
.opt{
  border:3px solid var(--nb-ink); border-radius:0; background:#fff; color:var(--nb-ink);
  padding:11px 20px; font-size:clamp(14px,1.4vw,18px); font-weight:800; cursor:pointer;
  box-shadow:var(--nb-sh-sm); transition:transform .08s, box-shadow .08s, background .08s;
}
.opt:hover{transform:translate(-2px,-2px); box-shadow:7px 7px 0 var(--nb-ink);}
.opt:active{transform:translate(5px,5px); box-shadow:0 0 0 var(--nb-ink);}
.opt[aria-pressed="true"]{background:#4dd0e1; box-shadow:var(--nb-sh-sm);}
.opt[aria-pressed="true"]::before{content:"▮ ";}
.namefield{
  border:3px solid var(--nb-ink); border-radius:0; background:#fff; box-shadow:var(--nb-sh-sm);
  padding:11px 14px; font-size:clamp(15px,1.5vw,19px); font-weight:800; width:220px;
  touch-action:auto; user-select:text; outline:none;
}
.namefield:focus{background:#fff9c4; box-shadow:7px 7px 0 var(--nb-ink);}
.start{
  display:block; width:min(1040px,100%); cursor:pointer; border-radius:0;
  background:#ff5a5a; color:#fff; border:5px solid var(--nb-ink);
  box-shadow:12px 12px 0 var(--nb-ink);
  font-size:clamp(22px,3vw,40px); font-weight:900; letter-spacing:.22em;
  padding:clamp(16px,2.6vh,30px); text-shadow:3px 3px 0 rgba(0,0,0,.35);
  transition:transform .08s, box-shadow .08s;
}
.start:hover{transform:translate(-3px,-3px); box-shadow:15px 15px 0 var(--nb-ink);}
.start:active{transform:translate(10px,10px); box-shadow:2px 2px 0 var(--nb-ink);}
.hint{
  margin:20px 0 0; padding:.7em 1em; max-width:1040px; text-align:center;
  background:#111; color:#ffd23f; border:3px solid var(--nb-ink); box-shadow:var(--nb-sh-sm);
  font-size:clamp(12px,1.1vw,15px); font-weight:800; line-height:1.7;
}

/* ---------- 遊戲頁 ---------- */
#game{background:var(--bg);}
.topbar{flex:none; height:8vh; min-height:52px; display:flex; align-items:center;
        justify-content:space-between; padding:0 1.4vw; gap:12px;}
.iconbtn{border:1px solid var(--line); background:#fff; border-radius:12px; cursor:pointer;
         padding:8px 16px; font-size:clamp(13px,1.2vw,17px); font-weight:600; color:var(--ink);}
.clock{font-variant-numeric:tabular-nums; font-size:clamp(26px,4vh,46px); font-weight:800; letter-spacing:.04em;}
.clock.low{color:var(--red); animation:tickpulse 1s ease-in-out infinite;}
@keyframes tickpulse{0%,100%{transform:scale(1); opacity:1}50%{transform:scale(1.16); opacity:.72}}

.arena{flex:1; display:grid; grid-template-columns:1fr minmax(290px,35vw) 1fr;
       gap:1vw; padding:0 1.2vw 1.4vh; min-height:0;}

.team{display:flex; flex-direction:column; min-height:0; border-radius:18px; padding:1vh 1vw;
      border:3px solid transparent;}
.team.L{background:var(--blue-soft); border-color:var(--blue-line);}
.team.R{background:var(--red-soft);  border-color:var(--red-line);}
.team.shake{animation:shake .32s;}
@keyframes shake{10%,90%{transform:translateX(-4px)}30%,70%{transform:translateX(7px)}50%{transform:translateX(-7px)}}

.thead{flex:none; display:flex; align-items:baseline; justify-content:space-between; padding:0 .4vw .6vh;}
.tname{font-size:clamp(16px,2.4vh,28px); font-weight:800;}
.tscore{font-size:clamp(22px,3.6vh,44px); font-weight:800; font-variant-numeric:tabular-nums;}
.team.L .tname,.team.L .tscore{color:var(--blue-dark);}
.team.R .tname,.team.R .tscore{color:var(--red-dark);}

.stage{flex:1; min-height:0; background:#fff; border-radius:14px; position:relative;
       display:flex; align-items:center; justify-content:center; overflow:hidden;}
.stage svg{width:100%; height:100%;}
.stage.ok::after{content:""; position:absolute; inset:0; background:var(--good-soft); animation:flash .4s ease-out;}
@keyframes flash{from{opacity:.95}to{opacity:0}}
.stage.miss{box-shadow:inset 0 0 0 5px var(--red);}

/* 兩排、置中：第一排 Do Re Mi Fa，第二排 Sol La Si —— 按鈕更大、位置更高 */
.pad{flex:none; display:grid; grid-template-columns:repeat(8,1fr); gap:.8vw; margin-top:1vh;}
.key{grid-column:span 2;}
.key:nth-child(5){grid-column:2 / span 2;}
.lift{flex:none; height:var(--lift,14vh);}
.key{border:2px solid #fff; border-radius:16px; background:#fff; cursor:pointer;
     font-size:clamp(18px,4vh,46px); font-weight:800; color:var(--ink);
     padding:clamp(12px,3.4vh,44px) 0; line-height:1; transition:transform .06s, background .12s;}
.team.L .key{border-color:var(--blue-line); color:var(--blue-dark);}
.team.R .key{border-color:var(--red-line);  color:var(--red-dark);}
.key.press{transform:scale(.94);}
.key.wrong{background:#ffdada; border-color:var(--red); color:var(--red-dark);}
.key.right{background:var(--good-soft); border-color:var(--good); color:var(--good);}
.key.ans{background:var(--good-soft); border-color:var(--good); color:var(--good);
         animation:answink .28s ease-in-out 3;}
@keyframes answink{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

.center{display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:0;}
.center svg{width:100%; height:auto; max-height:100%; overflow:visible;}
.rope-g{transition:transform .5s cubic-bezier(.22,1,.36,1);}

/* ---------- 拔河角色動畫 ---------- */
.kid{transform-box:fill-box; transform-origin:82% 100%;   /* 支點＝踩地的雙腳 */
     animation:strainL 1.3s ease-in-out infinite alternate;}
.kidsR .kid{animation-name:strainR;}
@keyframes strainL{from{transform:rotate(0deg) translate(0,0);}
                   to{transform:rotate(-2.5deg) translate(-3px,0);}}
@keyframes strainR{from{transform:rotate(0deg) translate(0,0);}
                   to{transform:rotate(2.5deg) translate(3px,0);}}
.kids.pulling .kid{animation:heaveL .5s cubic-bezier(.3,1.4,.4,1);}
.kidsR.pulling .kid{animation-name:heaveR;}
@keyframes heaveL{0%{transform:rotate(0) translate(0,0);}
                  30%{transform:rotate(-11deg) translate(-13px,4px);}
                  100%{transform:rotate(0) translate(0,0);}}
@keyframes heaveR{0%{transform:rotate(0) translate(0,0);}
                  30%{transform:rotate(11deg) translate(13px,4px);}
                  100%{transform:rotate(0) translate(0,0);}}
/* 被拉走的一方：腳步被拖著往前滑 */
.kids.slipping .kid{animation:slipL .5s ease-out;}
.kidsR.slipping .kid{animation-name:slipR;}
@keyframes slipL{0%{transform:translate(0,0) rotate(0);}
                 40%{transform:translate(9px,0) rotate(4deg);}
                 100%{transform:translate(0,0) rotate(0);}}
@keyframes slipR{0%{transform:translate(0,0) rotate(0);}
                 40%{transform:translate(-9px,0) rotate(-4deg);}
                 100%{transform:translate(0,0) rotate(0);}}
.skid{opacity:0;}
.kids.slipping .skid{animation:skidmark .5s ease-out;}
@keyframes skidmark{0%,100%{opacity:0}40%{opacity:.9}}
.rope-line{animation:ropebob 1.15s ease-in-out infinite alternate;}
@keyframes ropebob{from{transform:translateY(0)}to{transform:translateY(2.5px)}}
.sweat{transform-box:fill-box; transform-origin:50% 50%;
       animation:sweat 2.6s ease-in infinite;}
@keyframes sweat{0%,62%{opacity:0; transform:translate(0,0) scale(.6);}
                 70%{opacity:1; transform:translate(0,0) scale(1);}
                 100%{opacity:0; transform:translate(9px,-22px) scale(.8);}}
.dust{opacity:0; transform-box:fill-box; transform-origin:50% 100%;}
.kids.pulling .dust{animation:puff .55s ease-out;}
@keyframes puff{0%{opacity:0; transform:scale(.3);}
                30%{opacity:.85; transform:scale(1);}
                100%{opacity:0; transform:scale(1.7) translateY(-8px);}}
@media (prefers-reduced-motion:reduce){.kid,.rope-line,.sweat{animation:none;}}


/* ---------- 結算：華麗版 ---------- */
#result{align-items:center; justify-content:center; gap:1.6vh; overflow:hidden;
        background:#141a22; transition:background .5s;}
#rays{position:absolute; width:200vmax; height:200vmax; opacity:.14; pointer-events:none;
      animation:spin 26s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
#confetti{position:absolute; inset:0; overflow:hidden; pointer-events:none;}
#confetti i{position:absolute; top:-12vh; display:block; animation:fall linear infinite;}
@keyframes fall{0%{transform:translateY(0) rotate(0) scale(1);}
                100%{transform:translateY(125vh) rotate(900deg) scale(.85);}}
#trophy{width:clamp(90px,20vh,220px); z-index:1; animation:tpop .8s cubic-bezier(.2,1.7,.4,1) both, rock 2.4s ease-in-out 1s infinite;}
@keyframes tpop{0%{transform:scale(.2) rotate(-25deg); opacity:0;}
                70%{opacity:1;}100%{transform:scale(1) rotate(0); opacity:1;}}
@keyframes rock{0%,100%{transform:rotate(-4deg);}50%{transform:rotate(4deg);}}
#result .win{font-size:clamp(34px,10vh,120px); font-weight:900; color:#fff; text-align:center;
             z-index:1; letter-spacing:.04em; text-shadow:0 6px 0 rgba(0,0,0,.28);
             animation:wpop .65s cubic-bezier(.2,1.8,.4,1) .18s both;}
@keyframes wpop{from{transform:scale(.4) translateY(30px); opacity:0;}
                to{transform:scale(1) translateY(0); opacity:1;}}
#result .sc{font-size:clamp(20px,4.6vh,54px); color:#fff; opacity:.9; z-index:1;
            font-variant-numeric:tabular-nums; font-weight:700;
            animation:wpop .6s cubic-bezier(.2,1.6,.4,1) .34s both;}
#missBox{z-index:1; display:flex; flex-wrap:wrap; align-items:center; justify-content:center;
         gap:10px; max-width:min(1000px,92vw); margin-top:.6vh;
         animation:wpop .5s ease-out .46s both;}
#missBox .mlbl{color:#fff; opacity:.75; font-size:clamp(13px,2.1vh,20px); font-weight:800; letter-spacing:.08em;}
#missBox .mchip{display:inline-flex; align-items:center; gap:8px; color:#fff;
  background:rgba(255,255,255,.14); border:2px solid rgba(255,255,255,.45);
  border-radius:999px; padding:.3em .9em; font-size:clamp(13px,2.2vh,22px); font-weight:800;}
#missBox .mchip b{color:#ffd23f;}
#result .btns{display:flex; gap:18px; flex-wrap:wrap; justify-content:center; z-index:1; margin-top:1.4vh;
              animation:wpop .5s ease-out .55s both;}
#result button{border:none; border-radius:16px; padding:16px 38px; cursor:pointer;
               font-size:clamp(16px,2.8vh,28px); font-weight:800;}
#again{background:#fff; color:var(--ink);}
#back{background:transparent; color:#fff; border:2px solid rgba(255,255,255,.65);}

/* ---------- 倒數 ---------- */
#countdown{background:rgba(20,22,26,.9); align-items:center; justify-content:center;}
#countdown span{font-size:min(40vh,40vw); font-weight:900; color:#fff; animation:pop .9s ease-out;}
@keyframes pop{from{transform:scale(.4);opacity:0}40%{transform:scale(1);opacity:1}to{transform:scale(1);opacity:1}}
</style>
</head>
<body>

<!-- ============ 首頁 ============ -->
<div id="title" class="screen">
  <div id="stage">
    <img id="coverimg" src="cover.jpg" alt="五線譜拔河賽">
    <button class="hot" id="startGame" aria-label="開始挑戰"></button>
    <button class="hot" id="toSetup" aria-label="選擇你的隊伍與比賽設定"></button>
    <button id="fsBtnT" class="cornerbtn">⛶ 全螢幕</button>
    <div class="social" id="social"></div>
  </div>
</div>

<!-- ============ 設定頁 ============ -->
<div id="setup" class="screen hidden">
  <button class="opt" id="setupHome" style="align-self:flex-start">← 回首頁</button>
  <h1>五線譜拔河賽</h1>
  <p class="sub">兩隊同時作答，答對就把繩子拉過來</p>

  <div class="panel">
    <div class="row"><span class="lbl">譜號</span><div class="opt-group" data-key="clef"></div></div>
    <div class="row"><span class="lbl">音域</span><div class="opt-group" data-key="range"></div></div>
    <div class="row"><span class="lbl">比賽時間</span><div class="opt-group" data-key="time"></div></div>
    <div class="row"><span class="lbl">獲勝分差</span><div class="opt-group" data-key="win"></div></div>
    <div class="row"><span class="lbl">作答鍵高度</span><div class="opt-group" data-key="lift"></div></div>
    <div class="row"><span class="lbl">音效</span><div class="opt-group" data-key="cheer"></div></div>
    <div class="row"><span class="lbl">隊名</span>
      <input class="namefield" id="nameL" maxlength="8">
      <span style="color:var(--muted);font-weight:700">VS</span>
      <input class="namefield" id="nameR" maxlength="8">
    </div>
  </div>

  <button class="start" id="startBtn">開始比賽</button>
  <p class="hint">建議按 F11（Windows）或 ⌃⌘F（Mac）全螢幕。兩隊可同時觸控作答，互不影響。</p>
</div>

<!-- ============ 遊戲頁 ============ -->
<div id="game" class="screen hidden">
  <div class="topbar">
    <div style="display:flex;gap:10px">
      <button class="iconbtn" id="quitBtn">← 設定</button>
      <button class="iconbtn" id="fsBtn">⛶ 全螢幕</button>
    </div>
    <div class="clock" id="clock">02:00</div>
    <button class="iconbtn" id="pauseBtn">暫停</button>
  </div>

  <div class="arena">
    <div class="team L" id="teamL">
      <div class="thead"><span class="tname" id="hdrL">第一隊</span><span class="tscore" id="scL">0</span></div>
      <div class="stage" id="stageL"></div>
      <div class="pad" id="padL"></div>
      <div class="lift"></div>
    </div>

    <div class="center"><div id="tug"></div></div>

    <div class="team R" id="teamR">
      <div class="thead"><span class="tname" id="hdrR">第二隊</span><span class="tscore" id="scR">0</span></div>
      <div class="stage" id="stageR"></div>
      <div class="pad" id="padR"></div>
      <div class="lift"></div>
    </div>
  </div>

<script>
"use strict";
const scrTitle = document.getElementById("title");

/* =====================================================================
   1. 樂理模型
   diatonic index d = 字母序(C=0..B=6) + 7 * 八度
   中央 C4 = 0 + 7*4 = 28
   ===================================================================== */
const SOLFEGE = ["Do","Re","Mi","Fa","Sol","La","Si"];
const CLEF_BOTTOM = { treble: 30, bass: 18 };   // 底線音：高音譜 E4、低音譜 G2
const RANGES = {
  treble: { inside:[30,38], ledger:[26,42] },   // E4–F5 / A3–C6
  bass:   { inside:[18,26], ledger:[14,30] }    // G2–A3 / C2–E4
};

function pool(clefs, mode){
  const out = [];
  clefs.forEach(c=>{
    const [lo,hi] = RANGES[c][mode];
    for(let d=lo; d<=hi; d++) out.push({clef:c, d});
  });
  return out;
}

/* =====================================================================
   2. 五線譜繪製（依 SMuFL 比例：譜號字級 = 4 個譜線間距，基線落在譜號的定位線）
   ===================================================================== */
/* Bravura（SMuFL 標準樂譜字型，SIL OFL 授權）的原始輪廓，內嵌為 SVG path。
   座標原點 = SMuFL 定位點：gClef 落在 G4 線、fClef 落在 F3 線、符頭落在其垂直中心。
   單位換算：1 個譜線間距 = 360 path units。 */
const UPM = 360;
const GLYPH = {
gClef:"M541 -598C539 -615 541 -616 550 -625C706 -770 824 -953 824 -1174C824 -1299 789 -1423 730 -1509C708 -1541 671 -1581 655 -1581C635 -1581 590 -1544 562 -1512C455 -1394 420 -1214 420 -1064C420 -981 431 -887 441 -828C444 -811 445 -808 428 -793C220 -622 0 -416 0 -125C0 125 171 363 524 363C557 363 595 360 624 354C639 351 642 350 645 367C662 464 684 589 684 657C684 870 540 896 455 896C377 896 340 873 340 854C340 844 353 840 386 829C431 816 482 778 482 694C482 615 432 547 344 547C248 547 190 624 190 713C190 806 246 948 464 948C560 948 747 904 747 660C747 577 721 441 706 351C703 334 704 336 724 327C870 269 966 147 966 -16C966 -200 831 -363 619 -363C582 -363 582 -363 577 -389ZM677 -1358C724 -1358 763 -1319 763 -1240C763 -1080 626 -950 513 -851C503 -842 497 -844 494 -863C488 -900 485 -949 485 -995C485 -1220 589 -1358 677 -1358ZM520 -377C524 -350 524 -351 498 -343C372 -300 289 -186 289 -63C289 66 357 158 455 192C467 196 484 200 494 200C505 200 511 193 511 184C511 174 500 170 490 166C429 140 386 78 386 12C386 -71 442 -132 530 -157C553 -163 556 -161 559 -145L631 284C634 300 632 300 611 304C588 308 559 311 530 311C278 311 115 171 115 -29C115 -114 130 -228 249 -363C336 -459 402 -513 469 -567C484 -579 487 -577 490 -562ZM619 -148C616 -166 618 -170 635 -168C752 -158 848 -60 848 66C848 157 793 230 713 271C696 279 693 279 690 262Z",
fClef:"M363 -377C112 -377 0 -194 0 -56C0 59 60 158 177 158C268 158 330 95 330 6C330 -86 262 -144 192 -144C153 -144 138 -134 120 -134C101 -134 96 -145 96 -160C96 -217 183 -323 330 -323C482 -323 549 -173 549 53C549 455 350 680 14 871C1 878 -7 886 -7 897C-7 906 -1 914 12 914C19 914 27 912 36 907C390 734 765 478 765 40C765 -210 612 -377 363 -377ZM906 -259C861 -259 827 -225 827 -180C827 -135 861 -101 906 -101C950 -101 985 -135 985 -180C985 -225 950 -259 906 -259ZM907 102C863 102 829 135 829 180C829 225 863 258 907 258C952 258 985 225 985 180C985 135 952 102 907 102Z",
noteheadWhole:"M311 -180C120 -180 0 -101 0 -3C0 94 82 180 297 180C533 180 608 98 608 -3C608 -105 445 -180 311 -180ZM160 -91C176 -141 229 -148 274 -148C373 -148 452 -42 452 45C452 89 433 130 386 141C372 145 356 147 341 147C289 147 236 112 206 72C177 39 156 -10 156 -56C156 -68 157 -79 160 -91Z"
};
/* 譜號定位：G 譜號的螺旋中心對準第 2 線（G4）、F 譜號的兩點夾住第 4 線（F3） */
const CLEF_DEF = { treble:{glyph:"gClef", line:1}, bass:{glyph:"fClef", line:3} };
const NOTE_W = 608;   // 全音符符頭寬（path units）

function staffSVG(q){
  const S = 26;                                     // 譜線間距
  const W = 470, H = 13 * S, cy = H / 2;
  const lineY = i => cy + (2 - i) * S;              // i=0 底線 … 4 頂線
  const base  = CLEF_BOTTOM[q.clef];
  const steps = q.d - base;                         // 距底線的格數（1 格 = 半個間距）
  const noteY = lineY(0) - steps * S / 2;
  const noteX = W * 0.66;
  const k     = S / UPM;                            // path units → px
  const lw    = S * 0.13;                           // SMuFL 譜線粗細 = 0.13 間距

  let s = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">`;
  s += `<g stroke="#20232a" stroke-width="${lw}" shape-rendering="crispEdges">`;
  for(let i=0;i<5;i++) s += `<line x1="${S*0.5}" y1="${lineY(i)}" x2="${W-S*0.5}" y2="${lineY(i)}"/>`;
  s += `</g>`;

  // 加線：只畫音符實際觸及的那幾條，長度 = 符頭寬的 1.5 倍
  const half = NOTE_W * k * 0.75;
  const led = [];
  if(steps > 8) for(let m=10; m<=steps; m+=2) led.push(m);
  if(steps < 0) for(let m=-2; m>=steps; m-=2) led.push(m);
  led.forEach(m=>{
    const y = lineY(0) - m * S / 2;
    s += `<line x1="${noteX-half}" y1="${y}" x2="${noteX+half}" y2="${y}" `
       + `stroke="#20232a" stroke-width="${lw*1.4}" shape-rendering="crispEdges"/>`;
  });

  // 譜號
  const cd = CLEF_DEF[q.clef];
  s += `<path d="${GLYPH[cd.glyph]}" fill="#20232a" `
     + `transform="translate(${S*0.9},${lineY(cd.line)}) scale(${k})"/>`;

  // 全音符
  s += `<path d="${GLYPH.noteheadWhole}" fill="#20232a" `
     + `transform="translate(${noteX - NOTE_W*k/2},${noteY}) scale(${k})"/>`;

  return s + `</svg>`;
}

/* =====================================================================
   3. 拔河場景
   ===================================================================== */
/* 美式卡通風角色，姿勢依真實拔河力學：
   身體向後仰約 35°，雙腳蹬在身體前方（靠近對手側），腳跟入地，
   繩子貼著髖部通過、手臂近乎打直把繩子鎖在腰側，頭略抬。

      : hairStyle === 1
      ? `<path d="M -72 -140 q -3 -26 24 -26 q 26 0 24 24 q -7 -9 -15 -6 q 2 -9 -6 -12 q -4 10 -16 10 q -8 0 -11 10 z" fill="${hair}" stroke="${INK}" stroke-width="3.5" stroke-linejoin="round"/>
         <circle cx="-74" cy="-134" r="8" fill="${hair}" stroke="${INK}" stroke-width="3.5"/>`
      : `<path d="M -72 -142 q 8 -22 26 -20 q 19 2 21 19 q -7 -6 -14 -4 q -6 -10 -16 -7 q -9 3 -17 12 z" fill="${hair}" stroke="${INK}" stroke-width="3.5" stroke-linejoin="round"/>
         <path d="M -27 -148 q 12 -3 12 9 q 0 10 -11 8" fill="${hair}" stroke="${INK}" stroke-width="3.5" stroke-linejoin="round"/>`}
    ${band ? `<path d="M-70 -147q21 -10 44 -5" stroke="${band}" stroke-width="8" fill="none" stroke-linecap="round"/>
      <path d="M-70 -147q-11 1 -16 -7" stroke="${band}" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M-70 -146q-10 6 -17 4" stroke="${band}" stroke-width="5" fill="none" stroke-linecap="round"/>` : ""}
    <ellipse cx="-48" cy="-137" rx="6" ry="5.6" fill="#fff" stroke="${INK}" stroke-width="3"/>
    <ellipse cx="-32" cy="-139" rx="6" ry="5.6" fill="#fff" stroke="${INK}" stroke-width="3"/>
    <circle cx="-46" cy="-136" r="3.1" fill="${INK}"/>

    <path d="M -24 -148 L -37 -144" stroke="${INK}" stroke-width="5" stroke-linecap="round"/>

  </g>
  <g class="skid">
    <path d="M 62 -2 q -14 -6 -26 -2" stroke="#9aa2ad" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 26 -2 q -12 -5 -22 -1" stroke="#9aa2ad" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>`;
}

function tugSVG(){
  const W = 880, H = 300, mid = W/2, ropeY = 162, ground = ropeY + 78;
  const place = (x, flip, body) =>
    `<g transform="translate(${x},${ground}) scale(${flip},1)"><g class="kid">${body}</g></g>`;

  const BB = "#9ad4ff", RB = "#ffb0b0";           // 隊伍頭帶

  const blue2 = kid("#42a5f5","#1565c0","#d99a6c","#20140c",1,BB);
  const blue3 = kid("#1565c0","#0b3d75","#e8b98d","#2b1d10",2,BB);

  const red2  = kid("#ef5350","#b71c1c","#e0ab7d","#5a3a1c",0,RB);
  const red3  = kid("#c62828","#7d1414","#f6cda6","#3a2415",1,RB);
  const rope  = `M 44 ${ropeY} Q ${mid} ${ropeY + 5} ${W - 44} ${ropeY}`;

  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
    <line x1="${mid}" y1="14" x2="${mid}" y2="${ground + 24}" stroke="#aeb4be" stroke-width="4" stroke-dasharray="11 10" stroke-linecap="round"/>

      <g class="kids kidsR" id="kidsR">${place(W-122,-1,red3)}${place(W-212,-1,red2)}${place(W-302,-1,red1)}</g>
      <g>
        <path d="M ${mid} ${ropeY + 4} l 0 -28" stroke="${INK}" stroke-width="4"/>
        <path d="M ${mid} ${ropeY - 24} l 28 9 l -28 9 z" fill="#ffd54f" stroke="${INK}" stroke-width="3.5" stroke-linejoin="round"/>

}

/* ===== 首頁連結 ===== */
/* ★★★ 把你的兩個網址填在這兩行，首頁按鈕就會連過去 ★★★ */
const LINKS = {

const ICON_THREADS = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">

/* =====================================================================
   4. 設定
   ===================================================================== */
const OPTIONS = {
  clef : [["treble","高音譜號"],["bass","低音譜號"],["both","兩者混合"]],
  range: [["inside","僅五線之內"],["ledger","含加線"]],
  time : [[60,"1 分鐘"],[120,"2 分鐘"],[180,"3 分鐘"],[300,"5 分鐘"]],

};
const DEFAULTS = { clef:"treble", range:"inside", time:120, win:10, lift:14, cheer:1,
                   nameL:"第一隊", nameR:"第二隊" };
let cfg = Object.assign({}, DEFAULTS);
try{ Object.assign(cfg, JSON.parse(localStorage.getItem("mtow-cfg") || "{}")); }catch(e){}

function buildOptions(){
  document.querySelectorAll(".opt-group").forEach(g=>{
    const key = g.dataset.key;
    g.innerHTML = OPTIONS[key].map(([v,l]) =>
      `<button class="opt" data-v="${v}" aria-pressed="${String(cfg[key])===String(v)}">${l}</button>`).join(" ");
    g.addEventListener("click", e=>{
      const b = e.target.closest(".opt"); if(!b) return;
      cfg[key] = isNaN(b.dataset.v) ? b.dataset.v : Number(b.dataset.v);
      [...g.children].forEach(c => c.setAttribute("aria-pressed", c === b));
    });
  });
  nameL.value = cfg.nameL; nameR.value = cfg.nameR;
}
function saveCfg(){
  cfg.nameL = nameL.value.trim() || "第一隊";
  cfg.nameR = nameR.value.trim() || "第二隊";
  localStorage.setItem("mtow-cfg", JSON.stringify(cfg));
}

/* =====================================================================
   5. 遊戲狀態
   ===================================================================== */
const G = { running:false, paused:false, left:0, right:0, t:0,
            q:{L:null,R:null}, lock:{L:false,R:false}, bag:{L:null,R:null},
            miss:{}, pool:[], timer:null };

/* 洗牌抽牌：一副牌抽完才重洗，確保每個音都輪得到 */
function reshuffle(side){
  const bag = G.pool.slice();
  for(let i=bag.length-1; i>0; i--){ const j = Math.random()*(i+1) | 0; [bag[i],bag[j]] = [bag[j],bag[i]]; }
  G.bag[side] = bag;
}
function newQuestion(side){
  if(!G.bag[side] || !G.bag[side].length) reshuffle(side);
  let q = G.bag[side].pop();
  // 新舊兩副牌交界處可能連續同題，換下一張
  if(G.q[side] && q.d === G.q[side].d && q.clef === G.q[side].clef && G.bag[side].length){
    G.bag[side].unshift(q);
    q = G.bag[side].pop();
  }
  G.q[side] = q;
  document.getElementById(side==="L" ? "stageL" : "stageR").innerHTML = staffSVG(q);
}

/* 答錯統計 */
const LETTER = ["C","D","E","F","G","A","B"];
function noteLabel(q){
  return `${SOLFEGE[q.d % 7]}（${LETTER[q.d % 7]}${Math.floor(q.d / 7)}）`;
}
function recordMiss(q){
  const k = q.clef + "|" + q.d;
  G.miss[k] = G.miss[k] || { q, n:0 };
  G.miss[k].n++;
}

/* Web Audio 即時合成提示音，不需外部音檔 */
let AC = null;
function beep(freq, dur, vol){
  if(!cfg.cheer) return;
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if(AC.state === "suspended") AC.resume();
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = "triangle"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + dur + 0.03);
  }catch(e){}
}

function updateTug(){
  const diff = Math.max(-cfg.win, Math.min(cfg.win, G.left - G.right));
  const g = document.getElementById("ropeG");
  if(g) g.setAttribute("transform", `translate(${(diff / cfg.win) * -160},0)`);
  scL.textContent = G.left; scR.textContent = G.right;
}

function fmt(s){ return String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0"); }
function tick(){
  if(!G.running || G.paused) return;
  G.t--; clock.textContent = fmt(Math.max(0,G.t));
  clock.classList.toggle("low", G.t <= 10);
  if(G.t > 0 && G.t <= 10) beep(G.t <= 3 ? 1046 : 880, 0.13, 0.3);   // 最後十秒滴答
  if(G.t <= 0){ beep(523, 0.7, 0.35); finish(); }
}

/* 得分時該隊用力一拉 */
function heave(side){
  const win  = document.getElementById(side === "L" ? "kidsL" : "kidsR");
  const lose = document.getElementById(side === "L" ? "kidsR" : "kidsL");
  [[win,"pulling"],[lose,"slipping"]].forEach(([el,cls])=>{
    if(!el) return;
    el.classList.remove(cls);
    void el.getBoundingClientRect().width;          // 強制 reflow 以重播動畫
    el.classList.add(cls);
    setTimeout(()=>el.classList.remove(cls), 520);
  });
}

/* --- 作答：每一側完全獨立，沒有任何全域鎖，可同時多點觸發 --- */
function answer(side, value, keyEl){
  if(!G.running || G.paused || G.lock[side]) return;
  const q = G.q[side];
  if(!q) return;
  const correct = (q.d % 7) === value;
  const team  = document.getElementById(side==="L" ? "teamL" : "teamR");
  const stage = document.getElementById(side==="L" ? "stageL" : "stageR");

  if(correct){
    if(side==="L") G.left++; else G.right++;
    keyEl.classList.add("right");
    stage.classList.add("ok");
    setTimeout(()=>{ keyEl.classList.remove("right"); stage.classList.remove("ok"); }, 320);
    heave(side);
    updateTug();
    if(Math.abs(G.left - G.right) >= cfg.win){ finish(); return; }
    newQuestion(side);
  }else{
    // 答錯：標出正解讓學生看一眼，短暫鎖住後直接換下一題
    recordMiss(q);
    G.lock[side] = true;
    keyEl.classList.add("wrong");
    team.classList.add("shake");
    const pad = document.getElementById(side==="L" ? "padL" : "padR");
    const ansKey = pad.querySelector('.key[data-i="' + (q.d % 7) + '"]');
    if(ansKey) ansKey.classList.add("ans");
    stage.classList.add("miss");
    setTimeout(()=>{
      keyEl.classList.remove("wrong");
      team.classList.remove("shake");
      stage.classList.remove("miss");
      if(ansKey) ansKey.classList.remove("ans");
      G.lock[side] = false;
      if(G.running) newQuestion(side);
    }, 850);
  }
}

/* --- 多點觸控：pointerdown + 各自追蹤 pointerId --- */
function buildPad(side){
  const pad = document.getElementById(side==="L" ? "padL" : "padR");
  pad.innerHTML = SOLFEGE.map((n,i)=>`<button class="key" data-i="${i}">${n}</button>`).join("");
  const active = new Map();

  pad.addEventListener("pointerdown", e=>{
    const k = e.target.closest(".key"); if(!k) return;
    e.preventDefault();
    active.set(e.pointerId, k);
    k.classList.add("press");
    answer(side, Number(k.dataset.i), k);
  }, {passive:false});

  const release = e=>{
    const k = active.get(e.pointerId);
    if(k){ k.classList.remove("press"); active.delete(e.pointerId); }
  };
  pad.addEventListener("pointerup", release);
  pad.addEventListener("pointercancel", release);
  pad.addEventListener("pointerleave", release);
  pad.addEventListener("contextmenu", e=>e.preventDefault());
}

/* =====================================================================
   6. 流程
   ===================================================================== */
function startGame(){
  saveCfg();
  const clefs = cfg.clef === "both" ? ["treble","bass"] : [cfg.clef];
  G.pool = pool(clefs, cfg.range);
  G.left = 0; G.right = 0; G.t = cfg.time; G.paused = false;
  G.lock.L = false; G.lock.R = false;
  G.bag.L = null;   G.bag.R = null;
  G.miss = {};
  if(cfg.cheer){ try{ AC = AC || new (window.AudioContext || window.webkitAudioContext)(); AC.resume(); }catch(e){} }
  document.documentElement.style.setProperty("--lift", cfg.lift + "vh");
  hdrL.textContent = cfg.nameL; hdrR.textContent = cfg.nameR;
  tug.innerHTML = tugSVG();
  clock.textContent = fmt(G.t); clock.classList.remove("low");
  G.q.L = null; G.q.R = null;
  newQuestion("L"); newQuestion("R");
  updateTug();
  show(game);

  let n = 3;
  cdNum.textContent = n;
  countdown.classList.remove("hidden");
  const cd = setInterval(()=>{
    n--;
    if(n === 0){ cdNum.textContent = "開始！"; }
    else if(n < 0){
      clearInterval(cd);
      countdown.classList.add("hidden");
      G.running = true;
      clearInterval(G.timer);
      G.timer = setInterval(tick, 1000);
    } else {
      cdNum.textContent = n;
    }
    cdNum.style.animation = "none"; void cdNum.offsetWidth; cdNum.style.animation = "";
  }, 900);
}

/* ---- 勝利特效 ---- */
/* 歡呼音效：放在與本檔案同一資料夾即可，會依序尋找下列檔名 */
const CHEER_SRC = ["hoory.mp3","hooray.mp3","hooray.wav","hooray.m4a","cheer.mp3"];
function initCheer(){
  const a = document.getElementById("cheer");
  let i = 0;
  const next = ()=>{ if(i >= CHEER_SRC.length) return; a.src = CHEER_SRC[i++]; a.load(); };
  a.addEventListener("canplaythrough", ()=>{ a.dataset.ok = "1"; });
  a.addEventListener("error", next);
  next();
}
function initRays(){
  let p = "";
  for(let i=0;i<24;i+=2){
    const a = i*15*Math.PI/180, b = (i+1)*15*Math.PI/180;
    p += `M500 500L${(500+900*Math.cos(a)).toFixed(0)} ${(500+900*Math.sin(a)).toFixed(0)}`
       + `L${(500+900*Math.cos(b)).toFixed(0)} ${(500+900*Math.sin(b)).toFixed(0)}Z`;
  }
  rays.innerHTML = `<svg viewBox="0 0 1000 1000" style="width:100%;height:100%"><path d="${p}" fill="#fff"/></svg>`;
}
const CONF = ["#ffd54f","#ff8a65","#4fc3f7","#81c784","#f06292","#ba68c8","#ffffff","#ffb300"];
function initConfetti(){
  let h = "";
  for(let i=0;i<140;i++){
    const w = 6 + Math.random()*11, ht = 9 + Math.random()*15;
    h += `<i style="left:${(Math.random()*100).toFixed(1)}%;width:${w.toFixed(1)}px;height:${ht.toFixed(1)}px;`
       + `background:${CONF[i % CONF.length]};border-radius:${Math.random()<.3 ? "50%" : "2px"};`
       + `animation-duration:${(2.4+Math.random()*3.2).toFixed(2)}s;`
       + `animation-delay:-${(Math.random()*4).toFixed(2)}s;"></i>`;
  }
  confetti.innerHTML = h;
}

function finish(){
  G.running = false;
  clearInterval(G.timer);
  const d = G.left - G.right;

  // 繩子被一路拉過界線
  const g = document.getElementById("ropeG");
  if(g && d !== 0) g.setAttribute("transform", `translate(${d > 0 ? -215 : 215},0)`);

  winText.textContent  = d > 0 ? cfg.nameL + " 獲勝！" : d < 0 ? cfg.nameR + " 獲勝！" : "平手！";
  winScore.textContent = `${cfg.nameL} ${G.left}　—　${G.right} ${cfg.nameR}`;

  // 這場最常答錯的音
  const top = Object.values(G.miss).sort((a,b)=>b.n - a.n).slice(0,5);
  missBox.innerHTML = top.length
    ? `<span class="mlbl">這場最常答錯</span>`
      + top.map(m => `<span class="mchip">${noteLabel(m.q)}<b>×${m.n}</b></span>`).join("")
    : `<span class="mlbl">零失誤，全部答對！</span>`;
  result.style.background = d > 0 ? "#0e2d55" : d < 0 ? "#4d1216" : "#1c2027";
  trophy.style.display   = d === 0 ? "none" : "";
  confetti.style.display = d === 0 ? "none" : "";
  result.classList.remove("hidden");

  if(cfg.cheer && d !== 0 && cheer.dataset.ok){
    cheer.currentTime = 0;
    cheer.play().catch(()=>{});
  }
}

function show(el){
  [scrTitle, setup, game, result].forEach(s => s.classList.add("hidden"));
  el.classList.remove("hidden");
}
function toSetup(){
  G.running = false; clearInterval(G.timer);
  show(setup);
}
function toTitle(){
  G.running = false; clearInterval(G.timer);
  show(scrTitle);
}

/* 全螢幕切換 */
function toggleFS(){
  const d = document.documentElement;
  try{
    if(!document.fullscreenElement && !document.webkitFullscreenElement){
      (d.requestFullscreen || d.webkitRequestFullscreen).call(d);
    }else{
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    }
  }catch(e){}
}

/* =====================================================================
   7. 綁定
   ===================================================================== */
buildOptions();
buildPad("L");
buildPad("R");
buildSocial();
initRays();
initConfetti();
initCheer();

startGameBtnFix();
function startGameBtnFix(){
  document.getElementById("startGame").addEventListener("click", startGame);
  document.getElementById("toSetup").addEventListener("click", toSetup);
  document.getElementById("setupHome").addEventListener("click", toTitle);
  document.getElementById("fsBtnT").addEventListener("click", toggleFS);
  document.getElementById("fsBtn").addEventListener("click", toggleFS);
}
startBtn.addEventListener("click", startGame);
again.addEventListener("click", startGame);
back.addEventListener("click", toTitle);
quitBtn.addEventListener("click", toSetup);
pauseBtn.addEventListener("click", ()=>{
  if(!G.running) return;
  G.paused = !G.paused;
  pauseBtn.textContent = G.paused ? "繼續" : "暫停";
});

document.addEventListener("gesturestart", e=>e.preventDefault());
document.addEventListener("dblclick", e=>e.preventDefault());
</script>
